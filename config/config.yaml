
#This file controls the settings of the entire synthetic image generation pipeline.
#Instead of changing Python code whenever we want to modify a setting, our Python modules will read the values from here.

project:
  name: "Aerial_Country_Flag_Detection"
  version: "1.1"
  task: "country_specific_object_detection"
  framework: "YOLO"
  description: "Synthetic overhead drone imagery for national flag detection"

  random_seed: 42 #a different seed will generate a different set of images
  reproducible: true

camera:
  model: "SIYI A8 mini"

  active_sensor: "RGB"
  rgb_sensor: "Sony 1/1.7-inch CMOS"
  sensor_format: "1/1.7 inch"

  # Default UHD video frame size; verify this against frames recorded by the camera.
  native_resolution: [3840, 2160]
  output_resolution: [3840, 2160]
  resolution_label: "4K UHD"

  resize_mode: "none"
  digital_zoom: 1.0

  # Camera projection
  projection: "perspective"
  viewpoint: "nadir"
  direction: "straight_down"

  # Manufacturer-reported values
  hfov_deg: 81.0
  dfov_deg: 93.0

  # Validate the FOV and calibration against real frames before production.
  vfov_deg: null

  # Blender camera configuration
  blender:
    sensor_fit: "HORIZONTAL"
    horizontal_fov_deg: 81.0

  # Physical calibration
  pixel_size_um: null
  physical_focal_length_mm: null
  equivalent_focal_length_mm: 21.0
  sensor_width_mm: null
  sensor_height_mm: null

  intrinsic_matrix: null
  distortion_coefficients: null

  # Camera orientation
  gimbal_stabilized: true

  # Nominal orientation is nadir; synthesis applies the pitch/roll ranges below.
  off_nadir_angle_deg: [0, 0]
  pitch_variation_deg: [-10, 10]
  roll_variation_deg: [-10, 10]

  # Rotation around optical axis
  yaw_variation_deg: [0, 360]

  shutter_type: "rolling"
  focus_type: null

  stereo:
    enabled: false

flight:
  altitude_m:
    min: 50
    max: 100

  altitude_sampling: "uniform"
  camera_height_reference: "ground_level"
  ground:
    orientation: "horizontal"
    extent_m: [250, 250]
    terrain_scale: "fixed_real_world_scale"
  camera_position:
    x: 0
    y: 0
    z: "altitude_m"

flag:
  object_type: "national_flag_sheet"

  orientation: "horizontal"
  surface_alignment: "parallel_to_ground"

  pole_enabled: false
  mounted_on_ground: true

  # Ground-laid 2:1 flag sheets; change these if the deployment uses other sizes.
  physical_width_m: 2.0
  physical_height_m: 1.0
  physical_aspect_ratio: 2.0

  # Keep flag artwork proportional on the 2:1 sheet instead of stretching it.
  country_specific_texture: true
  country_specific_aspect_ratio: false
  design_mapping: "preserve_aspect_ratio"
  unused_area_handling: "flag_background_fill"

  preserve_emblems: true
  preserve_country_design: true

  material: "fabric"

  fabric:
    enabled: true

    wrinkles: true
    folds: true

    deformation_strength: [0.0, 0.15]
    maximum_surface_displacement_m: 0.03

    preserve_flag_colors: true
    preserve_flag_patterns: true

  placement:
    random_position: true
    avoid_overlapping_flags: true

    allow_partial_image_truncation: true
    avoid_image_truncation: false

    minimum_visible_fraction: 0.50

  shadows:
    enabled: true
    cast_on_ground: true
    randomize: true


countries:
  class_mode: "country"

  class_names:
    - egypt
    - united_states
    - united_kingdom
    - france
    - germany
    - italy
    - spain
    - portugal
    - netherlands
    - belgium
    - switzerland
    - sweden
    - norway
    - denmark
    - finland
    - poland
    - ukraine
    - turkey
    - saudi_arabia
    - united_arab_emirates
    - qatar
    - japan
    - china
    - india
    - brazil
    - canada
    - australia
    - south_korea

  preserve_class_order: true

  total_classes: 28

  sampling:
    strategy: "balanced"
    equal_probability: true

  texture_lookup_directory: "assets/flags"

  texture_file_format: "PNG"

  texture_mapping:
    match_by_country_name: true
    validate_missing_textures: true


synthesis:
  enabled: true

  engine: "Blender"
  rendering_engine: "BLENDER_EEVEE_NEXT"

  rendering_mode: "photorealistic"

  image_width: 3840
  image_height: 2160

  image_format: "PNG"
  color_space: "RGB"
  bit_depth: 8

  # Initial testing and production
  test_images: 50
  production_images: 10000

  images_per_scene: 5

  random_seed: 42
  reproducible: true

  # Physical geometry determines projected pixel size.
  pixel_size_control: "camera_geometry"

  # Approximate for a 2 m x 1 m flag, 81-degree HFOV, and 3840x2160 output.
  expected_projected_width_px: [45, 90]
  expected_projected_height_px: [22.5, 45]

  do_not_override_physical_projection: true


  camera_variation:
    enabled: true

    altitude_m: [50, 100]

    viewpoint: "nadir"

    pitch_variation_deg: [-10, 10]
    roll_variation_deg: [-10, 10]
    yaw_variation_deg: [0, 360]

    focal_length_variation: false
    digital_zoom_variation: false



  environment:
    primary_environment: "desert_airfield"

    randomize: true

    background_types:
      - desert_sand
      - compacted_soil
      - dry_gravel
      - sandy_ground
      - sparse_desert_vegetation
      - concrete_airfield

    background_distribution:
      desert_sand: 0.40
      compacted_soil: 0.20
      dry_gravel: 0.15
      sandy_ground: 0.10
      sparse_desert_vegetation: 0.10
      concrete_airfield: 0.05

    terrain:
      randomize: true
      scale: "fixed_real_world_scale"
      texture_resolution: "altitude_appropriate"

      include_small_surface_details: true
      include_ground_irregularities: true


    lighting:
      randomize: true

      conditions:
        - clear_sun
        - soft_sun
        - cloudy
        - overcast

      sun_angle_variation: true
      sun_intensity_variation: true
      ambient_light_variation: true

      shadows:
        enabled: true
        randomize: true


image_effects:

  sensor_noise:
    enabled: false
    model: "gaussian_plus_shot_noise"
    calibration_status: "pending"
    intensity: null

  motion_blur:
    enabled: false
    probability: 0.30
    model: "directional"
    calibration_status: "pending"
    intensity: null

  brightness_variation:
    enabled: true
    range: [0.80, 1.20]

  contrast_variation:
    enabled: true
    range: [0.85, 1.15]

  defocus_blur:
    enabled: false
    probability: 0.05
    calibration_status: "pending"

  compression:
    enabled: true

    master_format: "PNG"

    final_format: "JPEG"
    jpeg_quality: 92

    # Enable only after matching the compression of the real inference footage.
    simulate_video_compression: false
    video_codec: "H264"
    video_profile: "high"

  lens_distortion:
    enabled: false
    application: "opencv_postprocessing"

    calibration_required: true

    coefficients:
      k1: null
      k2: null
      p1: null
      p2: null
      k3: null

dataset:
  output_directory: "dataset"

  directories:
    images: "images"
    labels: "labels"
    previews: "previews"
    metadata: "metadata"
    logs: "generation_logs"

  image_resolution: [3840, 2160]

  image_naming:
    prefix: "flag"
    zero_padding: 6
    include_scene_id: true

  negative_image_ratio: 0.20

  split:
    train: 0.70
    val: 0.20
    test: 0.10

    shuffle: true

    split_by_scene: true
    prevent_scene_leakage: true

  preserve_original_4k: true


annotations:
  format: "YOLO"

  enabled: true

  class_mode: "country"

  class_names_reference: "countries.class_names"

  generate_bounding_boxes: true

  annotation_source: "projected_visible_flag_mesh"

  normalize_coordinates: true
  clip_boxes: true
  separate_label_files: true

  annotate_visible_flags: true
  ignore_fully_occluded_flags: true

  minimum_visible_fraction: 0.50

  minimum_bbox_width_px: 10
  minimum_bbox_height_px: 5

  include_shadows_in_bbox: false

  empty_labels_for_negative_images: true

  validate_labels: true

  label_format:
    fields:
      - class_id
      - x_center
      - y_center
      - width
      - height

    coordinate_range: [0.0, 1.0]


quality_control:
  enabled: true

  verify_image_resolution: true
  verify_image_label_pairs: true
  verify_bbox_coordinates: true
  verify_class_ids: true

  verify_country_texture_mapping: true
  verify_projected_flag_size: true

  detect_duplicate_images: true
  reject_corrupted_images: true

  verify_empty_negative_labels: true

  save_generation_metadata: true

  preview:
    enabled: true

    draw_bounding_boxes: true
    show_country_names: true
    show_class_ids: true

    show_projected_pixel_dimensions: true
    show_camera_altitude: true
    show_background_type: true


previews:
  enabled: true

  output_directory: "dataset/previews"

  save_original: true
  save_annotated: true

  save_country_samples: true
  save_altitude_samples: true

  preview_images_per_country: 5

  overlay:
    bounding_boxes: true
    class_names: true
    pixel_dimensions: true


metadata:
  enabled: true

  output_directory: "dataset/metadata"

  save_camera_parameters: true
  save_altitude: true
  save_country_identity: true

  save_flag_dimensions: true
  save_projected_pixel_dimensions: true

  save_background_type: true
  save_lighting_conditions: true
  save_random_seed: true

  save_scene_id: true

  format: "JSON"


training:
  preserve_original_4k: true

  framework: "YOLO"

  candidate_image_sizes:
    - 2048
    - 1280
    - 1024

  preferred_image_size: 2048

  preprocessing:
    resize_mode: "letterbox"
    preserve_aspect_ratio: true
    allow_stretching: false

  evaluate_by_country: true
  evaluate_by_object_size: true

  object_size_groups:
    small:
      width_px: [45, 59]

    medium:
      width_px: [60, 74]

    large:
      width_px: [75, 90]

  tiling:
    enabled: true

    tile_size: 1024
    overlap: 0.20

    preserve_annotations: true
    clip_boxes_to_tiles: true

  inference:
    evaluate_tiled_inference: true
    evaluate_full_image_inference: true


logging:
  enabled: true

  output_directory: "dataset/generation_logs"

  save_generation_report: true
  save_errors: true
  save_warnings: true

  report_format: "CSV"

  log:
    scene_id: true
    image_name: true
    country_class: true
    camera_altitude: true
    projected_width_px: true
    projected_height_px: true
    background_type: true
    generation_status: true


# =============================================================================
# generator: settings for the Python/OpenCV generator (generate.py).
# The spec above gives the physical facts (camera, altitude, flag size, classes,
# split, label rules). This section only fills in what the spec leaves open.
# Every size is in METRES, every probability is 0..1.
# =============================================================================
generator:

  # --- Realism layers: on/off switches ---------------------------------------
  # Phase 1 = a clean, correctly scaled generator. Switch layers on one by one
  # and check each against real SIYI frames before keeping it.
  # Layers the spec already switches are NOT here: fabric folds (flag.fabric),
  # flag shadows (flag.shadows), noise / motion / defocus / brightness /
  # contrast (image_effects.*.enabled).
  layers:
    colour_match: true        # pull flag colours toward the scene's colour cast + light
    scene_shadows: false      # big soft shadows of buildings/poles across the frame
    flag_fading: false        # sun-bleached flags
    flag_dirt: false          # sand / dust on the flags
    runway_markings: false    # painted lines on the ground
    distractors: false        # unlabelled look-alike objects (tarps, cloth, cars)
    haze: false
    vignette: false
    gamma: false

  supersample: 4              # objects are drawn 4x larger, then shrunk (anti-aliasing)

  # P(number of flags) in a frame that is NOT a negative image.
  # Negatives come from dataset.negative_image_ratio.
  flags_per_image: {1: 0.25, 2: 0.30, 3: 0.25, 4: 0.20}
  partial_flag_prob: 0.10     # chance a flag straddles the frame edge
  min_spacing_m: 1.0          # flags / distractors never closer than this

  # Class name -> file name in assets/flags, when the two differ.
  flag_files:
    united_states: america

  backgrounds:
    directory: assets/backgrounds   # images + index.yaml (GSD, group, type per file)
    max_upsample: 2.0               # avoid a background that must be enlarged more than 2x
    color_cast: 0.04                # +-4 % per channel
    markings_prob: 0.30             # used when layers.runway_markings is on
    marking_width_m: [0.45, 1.8]
    marking_length_m: [10, 40]

  flag_effects:
    fade_prob: 0.5
    fade_strength: [0.05, 0.35]
    dirt_prob: 0.4
    dirt_strength: [0.05, 0.30]
    fold_prob: 0.8                  # fold depth comes from flag.fabric.maximum_surface_displacement_m
    fold_shading: [0.05, 0.25]      # brightness change across a fold
    tilt_jitter: 0.04               # corner jitter: uneven ground / camera not exactly nadir
    edge_feather_px: 0.6            # fabric edges are never razor sharp

  compose:
    tint_strength: 0.35
    light_gain: [0.85, 1.10]
    contact_shadow_prob: 0.7        # thin shadow under the flag edge (flag.shadows)
    contact_shadow_strength: [0.15, 0.40]
    contact_shadow_offset_m: [0.02, 0.10]
    cast_shadow_prob: 0.35          # used when layers.scene_shadows is on
    cast_shadow_strength: [0.30, 0.60]

  distractors:
    directory: assets/distractors   # images + index.yaml (real size + clean crop per file)
    count: [0, 3]
    kinds: {image: 0.40, tarp: 0.15, cloth: 0.15, bag: 0.10, car: 0.10, striped_sheet: 0.10}

  # Ranges used when the matching image_effects switch is on (spec intensities are
  # still null = "calibration pending"). Replace with values measured on SIYI frames.
  camera_sim:
    haze_prob: 0.30
    haze_strength: [0.0, 0.08]
    vignette_strength: [0.0, 0.25]
    defocus_sigma_px: [0.3, 1.2]
    speed_mps: [0, 15]              # 0 = hovering
    exposure_s: [0.0005, 0.004]     # 1/2000 s .. 1/250 s
    read_noise: [0.002, 0.010]
    shot_noise: [0.0005, 0.004]
    gamma: [0.9, 1.1]

  keep_empty_tile_prob: 0.10        # most tiles with no flag are dropped
  preview_frames: 12                # annotated previews written per run

  # --- Batch recipe: python generate_batch.py ----------------------------------
  # Flags pasted on REAL background photos (full drone frames), for a first test
  # set on Roboflow. With 200 photos:
  #   50 stay empty (1 image each) + 150 x 3 images with 1, 2 or 3 flags = 500 images
  # Counts are exact (not "about"); all images of one photo share a split.
  batch:
    backgrounds_dir: assets/batch_backgrounds   # photos + optional index.yaml (gsd_m / altitude_m / group)
    negative_fraction: 0.25         # 50 of 200 photos stay empty
    images_per_background: 3        # the other photos give 3 images each
    flags_per_image: {1: 1, 2: 1, 3: 1}   # equal shares of 1, 2 and 3 flags, in random order
    focus_class: egypt
    focus_share: 0.60               # Egypt is in exactly 60 % of the images with flags
    random_flip: true               # each image of a photo: random flip / 180 deg turn
    edge_margin_m: 1.0              # flags stay fully inside the picture
    match_camera:                   # give the flag the photo's own camera look (generator/match.py)
      blur_sigma_px: [0.4, 1.2]     # lens softness (real flags in the reference photos are soft)
      noise: true                   # same sensor noise as the photo
      haze: true                    # same black level (haze) as the photo
    look:                           # some images get the look of a reference dataset (generator/look.py)
      prob: 0.5                     # share of the images that get one
      strength: [0.7, 1.0]          # 1 = match the reference fully
      min_contrast: 0.35            # never squash lightness contrast below 35 %
      min_colour: 0.5               # never squash colour below 50 %
      presets:                      # Lab mean / spread measured on the reference photos (500 px wide copies)
        pale_sand:                  # universe.roboflow.com/uavc/flags_gamed_awy (real flags, bright flat sand)
          {mean_L: [75.5, 78], mean_a: [3, 4.2], mean_b: [8.5, 12], std_L: [1.9, 3.9], std_a: [0.7, 1.0], std_b: [1.2, 3.4]}
        airfield:                   # universe.roboflow.com/uavc/uav2024-flags (airfield drone photos)
          {mean_L: [73, 78.5], mean_a: [6, 10], mean_b: [11, 25], std_L: [3.4, 5.0], std_a: [1.0, 1.8], std_b: [2.5, 4.5]}
    jpeg_quality: 95
    preview_images: 12
