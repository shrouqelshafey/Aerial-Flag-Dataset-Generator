# Large drone maps (orthomosaics) that background frames and textures are cut from.
#
#   python tools/cut_orthomosaics.py            (see that file for what it writes)
#
# The GeoTIFFs themselves are big (4-90 MB each) and are NOT in git: they live in
# assets/batch_backgrounds_sources/ (gitignored). `url` downloads the same file again.
#
#   file      GeoTIFF name in assets/batch_backgrounds_sources/
#   name      short name: becomes the file prefix and the split group of every cut
#   gsd_m     metres per pixel of the GeoTIFF (from the OpenAerialMap metadata)
#   type      one of synthesis.environment.background_types (config/config.yaml)
#   credit    LICENCE: all are CC-BY 4.0 = free to use, also in public datasets, but the
#             author must be credited. Keep this file next to any dataset made from them.
#
# Source: OpenAerialMap (openaerialmap.org), searched 2026-11-24 for CC-BY drone maps
# sharper than 6 cm/px over flat desert and airfields.

- file: iraq_tell_al_gaar.tif
  name: iraq_gaar
  gsd_m: 0.01665
  type: desert_sand
  credit: "Tell AL-Ga'ar, Iraq (2021-10-04), by A. A., OpenAerialMap, CC-BY 4.0"
  url: https://oin-hotosm-temp.s3.us-east-1.amazonaws.com/6966c0031415ad494774b07e/0/6966c0031415ad494774b07f.tif

